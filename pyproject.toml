[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doppler-jepa-pilot"
version = "0.1.0"
description = "Research pilot: radar-only Doppler-informed latent forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.5,<3", "matplotlib>=3.7", "pytest>=7"]

[project.optional-dependencies]
nuscenes = ["nuscenes-devkit==1.2.0", "numpy<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
